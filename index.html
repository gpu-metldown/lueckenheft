<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFCF8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lückenheft">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Lückenheft – Mut zur Lücke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFCF8; --surface:#FFFFFF; --grid:rgba(52,98,160,.11);
  --ink:#1E3A9E; --ink-soft:rgba(30,58,158,.09); --on-ink:#FFFFFF;
  --text:#1C2230; --muted:#5E6878; --line:#D5DCE5;
  --red:#C4122F; --red-soft:rgba(196,18,47,.08); --green:#1F7A4A; --margin:rgba(196,18,47,.38);
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --hand:"Caveat", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14171D; --surface:#1B1F27; --grid:rgba(140,170,220,.07);
    --ink:#93ACFF; --ink-soft:rgba(147,172,255,.12); --on-ink:#14171D;
    --text:#E6E8EE; --muted:#9AA3B2; --line:#2B313C;
    --red:#FF6B7B; --red-soft:rgba(255,107,123,.10); --green:#5FD293; --margin:rgba(255,107,123,.32);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14171D; --surface:#1B1F27; --grid:rgba(140,170,220,.07);
  --ink:#93ACFF; --ink-soft:rgba(147,172,255,.12); --on-ink:#14171D;
  --text:#E6E8EE; --muted:#9AA3B2; --line:#2B313C;
  --red:#FF6B7B; --red-soft:rgba(255,107,123,.10); --green:#5FD293; --margin:rgba(255,107,123,.32);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;min-height:100%;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--text);font-family:var(--serif);font-size:18px;line-height:1.55;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none !important}
.wrap{max-width:680px;margin:0 auto;padding:0 18px}

/* Home */
.masthead{padding:34px 0 6px}
.masthead h1{font-family:var(--hand);font-weight:700;color:var(--ink);font-size:clamp(54px,15vw,80px);line-height:.85;margin:0;letter-spacing:-.5px}
.masthead svg{display:block;width:min(270px,70vw);height:16px;margin:2px 0 0 4px;color:var(--red)}
.masthead p{margin:14px 0 0;color:var(--muted);font-size:16.5px;max-width:34em}
.books{display:grid;grid-template-columns:1fr 1fr;margin:24px 0 0;border-bottom:1.5px solid var(--line)}
.book{background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1.5px;padding:8px 4px 10px;font-family:var(--hand);font-size:30px;line-height:1;color:var(--muted);text-align:center}
.book small{display:block;font-family:var(--serif);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.book[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.passage .part{display:block;font-style:italic;font-size:17.5px;line-height:1.35;color:var(--muted);margin:26px 0 4px}
.passage .part:first-child{margin-top:0}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 6px}
.mode{display:flex;flex-direction:column;justify-content:flex-start;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left}
.mode strong{display:block;font-size:17px;font-weight:600}
.mode span{display:block;font-size:14px;color:var(--muted);line-height:1.35;margin-top:2px}
.mode[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--ink-soft)}
.mode[aria-pressed="true"] strong{color:var(--ink)}
.list{list-style:none;margin:20px 0 0;padding:0;border-top:1px solid var(--line)}
.list button{width:100%;display:grid;grid-template-columns:40px 1fr 52px;align-items:center;gap:12px;padding:15px 2px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left}
.list button:active{background:var(--ink-soft)}
.num{font-family:var(--hand);font-size:32px;line-height:1;color:var(--ink);text-align:center}
.ttl{font-size:17px;line-height:1.3}
.sub{display:block;font-size:14px;color:var(--muted);margin-top:3px}
.stamp{font-family:var(--hand);font-weight:700;color:var(--red);font-size:28px;line-height:1;border:2px solid currentColor;border-radius:50%;width:46px;height:46px;display:grid;place-items:center;transform:rotate(-9deg)}
.stamp small{font-size:.5em;font-weight:500;margin-left:1px}
.stamp{font-size:22px !important}
.stamp.low{color:var(--muted)}
.stamp.new{color:var(--muted);border-style:dashed;border-width:1.5px;font-size:18px;font-weight:500;transform:none}
.save{margin:0 0 40px;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
.save p{margin:0 0 4px;font-size:14.5px;line-height:1.4;color:var(--muted)}
.save p[data-state="cloud"]::before{content:"\2713  ";color:var(--green);font-weight:600}
.save p[data-state="device"]::before{content:"\2713  ";color:var(--green);font-weight:600}
.save p[data-state="local"]::before{content:"!  ";color:var(--red);font-weight:700}
.save.mist{margin-top:-28px}
.save.mist p{color:var(--text)}
.save-row{display:flex;gap:18px;flex-wrap:wrap}
.modal textarea{width:100%;min-height:110px;font:14px/1.4 ui-monospace,Menlo,monospace;color:var(--text);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px;margin:0 0 14px;resize:vertical;word-break:break-all}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 14px;font-size:15px;color:var(--muted)}
.link{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:15px}

/* Play */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:10px;height:54px}
.back{background:none;border:0;padding:8px 8px 8px 0;font-size:16px;color:var(--ink);display:flex;align-items:center;gap:2px;flex:none}
.back svg{width:20px;height:20px}
.bartitle{flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.clock{flex:none;font-variant-numeric:tabular-nums;font-size:16px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.clock.low{color:var(--red);border-color:var(--red);background:var(--red-soft)}
.progress{height:3px;background:transparent}
.progress i{display:block;height:100%;width:0;background:var(--ink);transition:width .25s ease}
.sheet{padding-top:22px;padding-bottom:280px}
.sheet h2{font-weight:400;font-style:italic;font-size:21px;line-height:1.3;margin:0 0 4px}
.meta{font-size:15px;color:var(--muted);margin:0 0 18px}
.passage{font-size:19px;line-height:2.25;padding-left:16px;border-left:2px solid var(--margin);hyphens:manual;overflow-wrap:break-word}
.gap{white-space:nowrap}
.gap input{
  font-family:var(--hand);font-size:25px;font-weight:500;line-height:1.05;color:var(--ink);
  background:transparent;border:0;border-bottom:2px solid var(--ink);border-radius:0;
  padding:0 1px;margin:0 0 0 -1px;width:2.8em;max-width:42vw;outline:none;-webkit-appearance:none;appearance:none;
  vertical-align:baseline;caret-color:var(--red);
}
.gap input:focus{background:var(--ink-soft);border-radius:5px 5px 0 0}
.gap input:disabled{color:var(--green);-webkit-text-fill-color:var(--green);border-bottom-color:var(--green);opacity:1}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));will-change:transform}
.hintcard{position:relative;max-width:680px;margin:0 auto 9px;padding:9px 40px 9px 12px;border:1.5px solid var(--ink);border-radius:12px;background:var(--paper);font-size:15.5px;line-height:1.35}
.hintcard .hc-row{display:grid;grid-template-columns:84px 1fr;gap:8px;padding:2px 0}
.hintcard .hc-row b{font-size:13px;font-weight:600;color:var(--ink);padding-top:2px}
.hintcard .hc-row + .hc-row{border-top:1px dashed var(--line);margin-top:3px;padding-top:5px}
.hintcard .hc-next{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.hintcard .hc-x{position:absolute;top:3px;right:3px;width:34px;height:34px;border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:0;touch-action:manipulation}
.dock-inner{max-width:680px;margin:0 auto;display:flex;gap:6px;align-items:center}
.key{flex:1 1 0;min-width:34px;max-width:50px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:20px;padding:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.key.tip{max-width:none;flex:0 0 auto;padding:0 12px;font-size:16px;color:var(--ink)}
.key.pressed{background:var(--ink-soft);border-color:var(--ink)}
.submit{flex:none;margin-left:auto;height:46px;padding:0 18px;border-radius:999px;border:0;background:var(--ink);color:var(--on-ink);font-weight:600;font-size:16px;touch-action:manipulation}

/* Result */
.report{display:grid;grid-template-columns:auto 1fr;gap:16px 20px;align-items:center;padding:26px 0 8px}
.grade{position:relative;width:118px;height:118px;display:grid;place-items:center;color:var(--red)}
.grade .n small{font-size:.42em;font-weight:500;margin-left:1px}
.grade .n{font-family:var(--hand);font-weight:700;font-size:58px;line-height:1;transform:rotate(-6deg);margin-top:4px}
.grade svg{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);overflow:visible}
.grade path{fill:none;stroke:var(--red);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s .15s cubic-bezier(.5,0,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.scale{grid-column:1/-1;position:relative;height:34px;margin:6px 0 0}
.scale .track{position:absolute;left:0;right:0;top:9px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--red-soft) 0 60%,var(--ink-soft) 60% 100%);border:1px solid var(--line)}
.scale .tick{position:absolute;top:3px;height:20px;border-left:1.5px dashed var(--muted)}
.scale .tick i{position:absolute;top:21px;left:-9px;font-style:normal;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.scale .me{position:absolute;top:5px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--red);border:2.5px solid var(--surface);box-shadow:0 0 0 1px var(--red)}
.scalenote{grid-column:1/-1;margin:4px 0 0;font-size:14px;line-height:1.4;color:var(--muted)}
.comment{font-family:var(--hand);color:var(--red);font-size:32px;line-height:1.05;margin:0}
.word{margin:4px 0 0;color:var(--muted);font-size:15.5px}
.facts{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:6px}
.facts div{padding:10px 4px;text-align:center;font-size:14px;color:var(--muted);line-height:1.3}
.facts div+div{border-left:1px solid var(--line)}
.facts b{display:block;font-size:21px;color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.badge{grid-column:1/-1;justify-self:start;font-family:var(--hand);font-size:24px;color:var(--green);margin:-4px 0 0}
.legend{font-size:14.5px;color:var(--muted);margin:22px 0 12px;line-height:1.5}
.legend .fix{font-size:20px}
.r{white-space:normal}
#resPassage{overflow-wrap:anywhere}
.passage{overflow-x:clip}
.r .u{font-family:var(--hand);font-size:25px;color:var(--ink)}
.r.ok .u::after,.r.hint .u::after{content:"\2713";font-family:var(--serif);font-size:13px;color:var(--green);margin-left:1px;vertical-align:super}
.r.hint .u::after{content:"\2713\00BD"}
.r .bad{font-family:var(--hand);font-size:25px;color:var(--ink);text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}
.fix{font-family:var(--hand);font-size:25px;font-weight:700;color:var(--red);margin-left:3px}
.r.empty .fix{margin-left:0;border-bottom:2px dashed var(--red)}
.mistakes{margin:30px 0 0}
.mistakes h3{font-size:19px;font-weight:600;margin:0 0 6px}
.mistakes ul{list-style:none;margin:0;padding:0}
.mistakes li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:17px}
.mistakes .right{font-weight:600}
.mistakes .yours{font-size:14.5px;color:var(--muted);text-align:right}
.mistakes .yours s{text-decoration-color:var(--red)}
.actions{display:grid;gap:10px;margin:28px 0 46px}
.btn{height:50px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-size:16.5px;font-weight:600;padding:0 18px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.btn.red{border-color:var(--red);color:var(--red);background:var(--red-soft)}

/* Modal + toast */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,14,22,.42);display:flex;align-items:flex-end;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.modal{width:100%;max-width:440px;background:var(--surface);border-radius:20px;padding:22px 20px 16px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal p{margin:0 0 18px;font-size:18px}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 66px);transform:translate(-50%,-8px);opacity:0;z-index:40;background:var(--text);color:var(--paper);padding:10px 16px;border-radius:12px;font-size:15.5px;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}

@media (max-width:370px){
  .passage{font-size:18px;padding-left:12px}
  .modes{grid-template-columns:1fr}
  .submit{padding:0 14px}
}
@media (prefers-reduced-motion: reduce){
  .grade path{animation:none;stroke-dashoffset:0}
  .progress i,.toast{transition:none}
}
</style>
</head>
<body>
<section id="home">
  <div class="wrap">
    <header class="masthead">
      <h1>Lückenheft</h1>
      <svg viewBox="0 0 270 16" preserveAspectRatio="none" aria-hidden="true"><path d="M3 10 C 60 4, 120 13, 180 7 S 250 6, 267 9" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      <p id="intro"></p>
    </header>
    <div class="books" role="tablist" aria-label="Buch">
      <button class="book" role="tab" id="bookB1" data-book="b1"><small>Mut zur Lücke</small>Band 1</button>
      <button class="book" role="tab" id="bookB2" data-book="b2"><small>Mut zur Lücke</small>Band 2</button>
    </div>
    <div class="modes" role="group" aria-label="Modus">
      <button class="mode" id="modeU" aria-pressed="true"><strong>Übung</strong><span>Ohne Zeitlimit, mit Tipps. Fortschritt wird gespeichert.</span></button>
      <button class="mode" id="modeP" aria-pressed="false"><strong>Prüfung</strong><span id="examInfo"></span></button>
    </div>
    <ul class="list" id="list"></ul>
    <div class="foot"><span id="totals"></span><button class="link" id="resetAll">Alles zurücksetzen</button></div>
    <div class="save">
      <p id="saveState" data-state="pending"></p>
      <div class="save-row"><button class="link" id="exportBtn">Sicherungscode kopieren</button><button class="link" id="importBtn">Sicherungscode laden</button></div>
    </div>
    <div class="save mist">
      <p id="mistakeCount"></p>
      <div class="save-row"><button class="link" id="mistakesBtn">Fehler exportieren</button></div>
    </div>
  </div>
</section>

<section id="play" hidden>
  <div class="topbar">
    <div class="wrap">
      <button class="back" id="backBtn" aria-label="Zur Übersicht"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Übersicht</button>
      <div class="bartitle" id="barTitle"></div>
      <div class="clock" id="clock" aria-live="off">0:00</div>
    </div>
    <div class="progress" aria-hidden="true"><i id="progFill"></i></div>
  </div>
  <div class="wrap sheet">
    <h2 id="playTitle"></h2>
    <p class="meta" id="playMeta"></p>
    <div class="passage" id="passage"></div>
  </div>
</section>

<div class="dock" id="dock" hidden>
  <div class="hintcard" id="hintCard" hidden aria-live="polite"></div>
  <div class="dock-inner">
    <button class="key" data-ch="ä" aria-label="ä einfügen">ä</button>
    <button class="key" data-ch="ö" aria-label="ö einfügen">ö</button>
    <button class="key" data-ch="ü" aria-label="ü einfügen">ü</button>
    <button class="key" data-ch="ß" aria-label="ß einfügen">ß</button>
    <button class="key tip" id="tipBtn">Tipp</button>
    <button class="submit" id="submitBtn">Abgeben</button>
  </div>
</div>

<section id="result" hidden>
  <div class="topbar">
    <div class="wrap">
      <button class="back" id="backBtn2" aria-label="Zur Übersicht"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Übersicht</button>
      <div class="bartitle" id="resTitle"></div>
    </div>
  </div>
  <div class="wrap">
    <div class="report" id="report"></div>
    <p class="legend">Richtig in Blau mit <span style="color:var(--green)">✓</span>. Falsche Antworten sind durchgestrichen, die Korrektur steht in <span class="fix">Rot</span> daneben. ½ bedeutet: Buchstaben-Tipp benutzt, halber Punkt. Grammatik- und Bedeutungs-Tipps kosten nichts.</p>
    <div class="passage" id="resPassage"></div>
    <div class="mistakes" id="mistakes"></div>
    <div class="actions" id="actions"></div>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<canvas id="confetti" hidden></canvas>
<script>
const TEXTS = [
{id:1, short:'Pantoffelhelden', title:'„Pantoffelhelden“ – Straßenschuhe in der Wohnung',
raw:`In Deutschla[nd] ist e[s], anders a[ls] z. B. i[m] asiatischen Kulturkr[eis], keine überli[eferte] und v[or] allem eingeh[altene] Tradition, Sch[uhe] vor Betr[eten] einer Wohn[ung] oder ein[es] Hauses unaufgef[ordert] auszuziehen. Men[sch] und Fam[ilie] legen i[n] den mei[sten] Fällen na[ch] individuellen Vorli[eben] Regeln z[um] Gebrauch d[er] Straßen- od[er] Hausschuhe fe[st]. Daher gi[lt] es a[ls] ausgenommen höf[lich], sich v[or] Betreten ei[ner] Wohnung, i[n] der m[an] sich vorauss[ichtlich] länger aufha[lten] wird, na[ch] den Reg[eln] des Hau[ses] zu erkun[digen] und gegeben[enfalls] auch eig[ene] Hausschuhe mitzub[ringen]. Wahlweise ka[nn] man ei[ne] Wohnung natü[rlich] nach d[er] Erkundigung na[ch] den Gepfloge[nheiten] auf Soc[ken] betreten od[er] um Panto[ffeln] oder Soc[ken] für Gä[ste] bitten.`},
{id:2, short:'Arbeiten im Sitzen', title:'Arbeiten im Sitzen – ein Risiko für den Arbeitgeber?',

{id:21, short:"Goethe", title:"Goethe", raw:"Der 1749 i[n] Frankfurt a[m] Main gebo[rene] Johann Wolf[gang] von Goe[the] gilt ne[ben] seinem et[was] jüngeren Zeitgeno[ssen] Friedrich Schi[ller] als Inbe[griff] des deut[schen] Literaturschaffenden. Ab[er] nicht n[ur] das: Weltw[eit] assoziieren Mens[chen] den Na[men] dieses vielse[itigen] Künstlers ni[cht] nur m[it] literarischen Leist[ungen], sondern au[ch] mit Deutschla[nd] selbst. Goe[the], den m[an] bei Bezugnah[me] auf se[ine] Werke häu[fig] nur m[it] dem Familienna[men] bezeichnet, w[ar] nicht n[ur] ein ho[ch] talentierter Schriftstel[ler] und Theateraut[or], sondern w[ar] unter sei[nen] Zeitgenossen au[ch] als Jur[ist], Politiker u[nd] Naturwissenschaftler m[it] einer hervorr[agenden] Beobachtungsgabe beka[nnt]. Zu Goet[hes] bekanntesten Wer[ken] zählen d[ie] Tragödie „Fau[st]“ und d[er] Roman „D[ie] Leiden d[es] jungen Wert[her]“."},
{id:22, short:"Stoffe im Wein", title:"Gesundheitsschädliche Stoffe im Wein", raw:"Pflanz[liche] Gerbstoffe, sogen[annte] Tannine, verlei[hen] Rotweinen un[ter] anderem ih[ren] herben, trock[enen] Geschmack. S[ie] werden Wei[nen] während d[er] Reifung entw[eder] künstlich zuge[setzt] oder gela[ngen] über d[ie] Holzfässer, i[n] denen d[er] Wein gela[gert] wird, i[n] den Alk[ohol]. Was vi[ele] jedoch ni[cht] wissen, i[st], dass s[ie] nach Anna[hmen] einiger Expe[rten] und Medi[ziner] vermutlich au[ch] dafür verantw[ortlich] sind, da[ss] Weintrinker a[m] nächsten T[ag] gelegentlich üb[er] Kopfschmerzen kla[gen], die nic[hts] mit übermä[ßigem] Alkoholkonsum z[u] tun ha[ben]. Neben Tann[inen] werden ab[er] auch d[ie] Farbstoffe i[m] Rotwein a[ls] möglicher Gru[nd] für d[en] Kopfschmerz verm[utet], der häu[fig] mit ei[ner] Histaminausschüttung einhe[rgeht] und so[mit] als allerg[ischer] Kopfschmerz einge[stuft] werden kann."},
{id:23, short:"Informationen aus dem Internet", title:"Verlässlichkeit von Informationen aus dem Internet", raw:"Die Nut[zung] elektronischer Med[ien] zum Wiss[ens]- oder Informationserw[erb] ist i[n] vielen Berei[chen] des Leb[ens] auf d[em] Vormarsch. O[b] nun d[ie] Hausaufgabe i[n] der Sch[ule] oder d[ie] Bachelor-Arbeit a[m] Ende d[es] Studiums: Mith[ilfe] von Online-Datenban[ken] und Informationsport[alen] wird d[er] Zugriff a[uf] Informationen heutz[utage] deutlich beschle[unigt] und zugl[eich] einfacher. W[ie] verlässlich üb[er] das Intern[et] bezogene Informa[tionen] jedoch i[m] Vergleich z[u] traditionell üb[er] Bücher erarbe[iteten] sind, lä[sst] sich n[ur] schwer sa[gen]. Sicher i[st], dass d[ie] redaktionelle Bearbe[itung] von Online-Datenban[ken] und so[mit] auch d[ie] Überprüfung do[rt] präsentierter Fak[ten] häufig z[u] wünschen üb[rig] lassen. B[ei] der Arb[eit] mit Online-Informa[tionen] lohnt si[ch] daher d[ie] Konsultation v[on] Zweitquellen."},
{id:24, short:"Internetshopping", title:"Internetshopping kontra lokales Geschäft", raw:"Die Veränderungen d[es] digitalen Zeitalt[ers] sind inzwi[schen] vollständig i[n] der We[lt] des Kons[ums] angekommen. D[ie] meisten Fir[men], die i[n] der rea[len] Welt Gesch[äfte] oder Niederlass[ungen] unterhalten, bie[ten] ihren Kun[den] ihre Dien[ste] alternativ au[ch] über ei[ne] virtuelle Geschäftsprä[senz] an u[nd] können s[o] beide Marktsegm[ente] für d[en] Verkauf ih[rer] Produkte nut[zen]. In man[chen] Branchen lie[gen] das Internetgesc[häft] und d[er] daraus gener[ierte] Umsatz so[gar] schon s[o] weit v[or] den Gesch[äften] in Stä[dten], dass teilw[eise] bereits Lä[den] geschlossen wer[den] können bz[w]. aufg[rund] von abnehm[enden] Verkaufszahlen so[gar] müssen. Intere[ssant] wird i[n] Zukunft se[in], wie d[ie] Veränderung d[er] Konsumlandschaft d[as] Bild d[er] Innenstädte i[n] Deutschland beeinf[lussen] wird."},
{id:25, short:"Haftpflichtversicherung", title:"Haftpflichtversicherungen für Mieter – oft ein Muss", raw:"Bei Anmie[tung] einer Woh[nung] oder ei[nes] Hauses wi[rd] in Deutschla[nd] neben d[er] üblichen Kau[tion], die i[n] der Re[gel] 1-2 Monatsmie[ten] umfasst, häu[fig] auch d[er] Nachweis ei[ner] privaten Haftpflichtversic[herung] gefordert. Ei[ne] solche Versic[herung] deckt Schadensfäl[le], die du[rch] eigenes Versch[ulden] an frem[dem] Eigentum entst[anden] sind, a[b] und entla[stet] so d[en] Verursacher gena[uso] wie d[en] finanziell Geschä[digten] in d[er] Abwicklung d[es] Schadensfalls. Ne[ben] dieser o[ft] auch „Privathaftpfl[icht]“ genannten Versic[herung] empfiehlt si[ch] weiterhin d[er] Abschluss ei[ner] Hausratversicherung, d[ie] gewöhnlich d[as] Inventar ei[nes] Haushalts ge[gen] Feuer, St[urm], Hagel u[nd] Diebstahl sch[ützt], sodass i[m] Schadensfall d[er] Wiederbeschaffungswert d[er] beschädigten Gü[ter] ersetzt w[ird]. Die Beitragshö[he] beider Versicherungsar[ten] ist überschaubar."},
{id:26, short:"Energiealternativen", title:"Energiealternativen zu Öl und Erdgas", raw:"Angesichts Schr[itt] für Schr[itt] versiegender Que[llen] fossiler Brennsto[ffe] und d[er] scheinbar endl[osen] Nachfrage d[er] Erdbevölkerung na[ch] Energie wer[den] weltweit im[mer] mehr Stim[men] laut, d[ie] eine Energiewe[nde], also e[in] Umdenken i[n] der glob[alen] Energiepolitik for[dern]. Eine entsche[idende] Rolle i[n] der Umgest[altung] unseres weltw[eiten] Umgangs m[it] Energie wi[rd] der Einsa[tz] erneuerbarer Ener[gien] spielen. Un[ter] erneuerbaren Ener[gien] versteht m[an] Energiequel[len], die si[ch] in ih[rer] Nutzung dad[urch] auszeichnen, da[ss] die Que[lle] ihre Ener[gien] in qu[asi] unerschöpflicher Me[nge] zur Verfü[gung] stellen ka[nn] oder a[uf] einem Rohst[off] basiert, d[er] zumindest se[hr] schnell nachw[ächst]. Zu d[en] erneuerbaren Ener[gien] zählen un[ter] anderem Was[ser]- und Windene[rgie], Solarenergie, Erdwär[me] sowie Meeresenergie."},
{id:27, short:"Imbissbude", title:"Die Imbissbude – eine aussterbende Tradition?", raw:"Nirgendwo wird s[ie] so he[iß] geliebt u[nd] ist i[n] beinahe je[dem] Ort vert[reten] wie i[n] Deutschland u[nd] dem restl[ichen] Mitteleuropa: D[ie] Imbissbude. Un[ter] einer Imbissbu[de] versteht m[an] einen i[n] der Re[gel] mobilen, manc[hmal] jedoch au[ch] fest verba[uten] Anhänger, i[n] dem Imbissart[ikel] wie Pom[mes] frites, Bratwur[st], Currywurst, Bur[ger] und Getr[änke] verkauft wer[den]. Meist wer[den] sie a[n] viel befah[renen] Straßen od[er] in Nä[he] von Bürogebäu[den] platziert, u[m] Gästen i[n] der Mittagspa[use] eine schn[elle] Mahlzeit servi[eren] zu kön[nen]. Gegessen wi[rd] am Imb[iss] mit Plastikbes[teck] und v[on] Papptellern, d[ie] nach d[em] Verzehr d[es] Gerichts entso[rgt] werden. A[us] Umweltschutzgründen grei[fen] einige Imbissbudenbetre[iber] deswegen inzwi[schen] oft a[uf] Holzbesteck zurück."},
{id:28, short:"Urbanes Gärtnern", title:"Urbanes Gärtnern – Gartengestaltung in der Stadt", raw:"D[ie] zunehmende Urbani[sierung] der Industrienati[onen], also d[er] Trend, da[ss] immer me[hr] Menschen me[ist] auf d[er] Suche na[ch] einer bess[eren] Zukunft d[ie] ländlichen Regi[onen] eines Lan[des] verlassen u[nd] sich i[n] Städten ansi[edeln], hat Auswir[kungen] auf d[ie] unterschiedlichsten Ebe[nen] unserer Exis[tenz]: Nicht zul[etzt] unterdrücken w[ir] durch e[in] Leben a[uf] wenig Ra[um] mit we[nig] Natur un[ser] Bedürfnis na[ch] natürlichem Wach[stum] in d[er] Natur i[m] Wechsel d[er] Jahreszeiten. Vi[ele] Jahre la[ng] fristete die[ses] Bedürfnis i[n] Form v[on] mit Blu[men] bepflanzten Balkonkäs[ten] ein kümmer[liches] Dasein. Inzwi[schen] jedoch erke[nnen] immer me[hr] Städter d[en] beruhigenden u[nd] auch befried[igenden] Aspekt d[es] Anbaus v[on] Pflanzen a[uf] Balkonen u[nd] in öffentlichen Gärten."},
{id:29, short:"Die Walz", title:"Die Walz – eine aussterbende Tradition", raw:"D[ie] Tradition d[es] klassischen Handwe[rks], Gesellen na[ch] Abschluss ih[rer] Ausbildung f[ür] mehrere Ja[hre] auf Wander[schaft] zu schi[cken], um i[n] anderen Regi[onen] des Lan[des] oder i[m] Ausland Berufserfah[rung] zu sam[meln] und si[ch] später a[ls] „Meister“ z[u] qualifizieren, i[st] in ähnli[chen] Formen welt[weit] zu fin[den]. Im deuts[chen] Sprachraum wi[rd] die Durchführ[ung] jedoch vermu[tlich] am institutiona[lisiertesten] gehandhabt: Gese[llen] mussten b[is] weit i[ns] Zeitalter d[er] Industrialisierung hin[ein] zwischen z[wei] und dr[ei] Jahren a[uf] Wander[schaft] gehen, oh[ne] in die[ser] Zeit ih[re] Heimatregion od[er] Heimatstadt z[u] besuchen. D[ie] Einhaltung d[er] strengen Walzreg[eln] wurde anh[and] eines lücke[nlos] zu führe[nden] „Walzbuches“ bel[egt], in d[em] Auftraggeber ih[re] Bewertungen aufschrieben."},
{id:30, short:"Marksburg", title:"Marksburg am Rhein", raw:"Anders als ein Großte[il] der a[m] Rhein z[u] findenden Bur[gen] und Burgrui[nen] ist d[ie] Marksburg i[m] Mittelrheintal e[in] Produkt mittelalt[erlicher] Baukunst u[nd] die einz[ige], nicht zerstö[rte] Höhenburg i[n] dieser Reg[ion]. Unter unterschi[edlichen] Namen fin[det] sie s[eit] dem 13. Jahrhun[dert] in histor[ischen] Dokumenten Erwäh[nung], es i[st] jedoch anzun[ehmen], dass s[ie] bereits frü[her] erbaut wu[rde]. Die Marksbu[rg] ist e[in] ausgesprochen belie[btes] Ausflugsziel d[es] Mittelrheintals u[nd] bietet ih[ren] Besuchern ei[nen] tiefen Einbl[ick] in d[ie] mittelalterliche Gesch[ichte]. Die Bu[rg] war i[m] Zweiten Weltkri[eg] schwer besch[ädigt] worden, i[st] inzwischen ab[er] restauriert u[nd] mit Rittersa[al], Burgküc[he] und weit[eren] zugänglichen Berei[chen] heute ei[ne] gern besu[chte] Attraktion f[ür] Touristen a[us] aller Welt."},
{id:31, short:"Dicke Gesellschaft", title:"Dicke Gesellschaft – Übergewicht in Industrieländern", raw:"Die Gesells[chaften] der Industrielän[der] können du[rch] ihre Stru[ktur], die vorwi[egend] sitzend ausge[übte] Erwerbstätigkeit u[nd] das grenz[enlos] scheinende Überang[ebot] an Spe[isen] und Geträ[nken] jenseits jegli[cher] Saisonalität inzwi[schen] als adipo[gen], also a[ls] „Übergewicht u[nd] Fettleibigkeit förd[ernd] oder generi[erend]“ bezeichnet wer[den]. Die Nahrungsaufn[ahme] ist ni[cht] mehr n[ur] Lebenserhalt, sond[ern] auch bz[w]. primär Genusssac[he]. Neben uns[erer] sitzenden Tätig[keit] verbringen w[ir] zusätzlich au[ch] oft d[ie] Freizeit sit[zend]. So entst[ehen] Krankheiten, de[ren] Ursachen pri[mär] in uns[erer] Überflussgesellschaft begrü[ndet] liegen. Wich[tig] ist es da[her], diesen Kreisla[uf] zu durchbre[chen] und beispie[lsweise] bewusst a[uf] das Überange[bot] in uns[eren] Supermärkten z[u] verzichten, u[m] sich d[em] Bedarf mögl[ichst] angemessen z[u] ernähren."},
{id:32, short:"Statistik-Diskussion", title:"Fiktive Diskussion einer Statistik in einem Buch für Deutschlernende", raw:"Die in dieser Publikation verwe[ndete] Statistik wu[rde] vom Statist[ischen] Bundesamt veröffe[ntlicht] und zei[gt] in dr[ei] Tortendiagrammen d[ie] verschiedenen Nationa[litäten] der i[n] Deutschland lebe[nden] Menschen m[it] ausländischen Päs[sen] im Verl[auf] des 20. Jahrhund[erts]. Aus d[en] Daten ge[ht] hervor, da[ss] sich d[ie] Gewichtung unterschi[edlicher] Nationalitäten i[m] Verlauf d[er] Jahre te[ils] drastisch versch[oben] hat. S[o] hat si[ch] beispielsweise na[ch] dem Zwei[ten] Weltkrieg d[ie] Zusammensetzung d[er] Nationalitäten, d[ie] sich entsch[ieden] haben, i[n] Deutschland z[u] leben u[nd] zu arbe[iten], vollkommen verä[ndert]. Der Ante[il] der i[n] Westdeutschland lebe[nden] Osteuropäer z. B. fi[el] in d[er] Zeit d[es] Kalten Krie[ges] beinahe a[uf] null, ei[ne] Entwicklung, d[ie] sich z[um] Ende d[es] zwanzigsten Jahrhund[erts] wieder umzuke[hren] begann."},
{id:33, short:"Biosphärenreservate", title:"Biosphärenreservate", raw:"Die Einrichtung von sogenannten Biosphärenreser[vaten] in Deutschla[nd] wurde du[rch] die UNE[SCO] angeregt, u[m] Regionen z[u] kennzeichnen, d[ie] im Zusammenwir[ken] von Men[sch] und Na[tur] beispielhafte u[nd] innovative We[ge] gehen u[nd] die du[rch] ihre Nachhal[tigkeit] hervorstechen. Hier[bei] handelt e[s] sich u[m] Ökosysteme, i[n] denen ni[cht] nur z[um] Schutz u[nd] zur Bewa[hrung] der Flo[ra] oder Fa[una] außergewöhnliche Maßna[hmen] ergriffen wur[den], sondern i[n] denen Bewirtsc[haftung] unter Berücksi[chtigung] des Klimawand[els] und d[ie] Beteiligung d[er] Bürger a[n] Prozessen ei[ne] übergeordnete Ro[lle] spielen. Betri[eben] und verw[altet] werden d[er] Aufbau u[nd] die Erweit[erung] des Netzwerks v[on] Biosphärenreservaten du[rch] das UNESCO-Prog[ramm] „Der Men[sch] und d[ie] Biosphäre“. I[n] Deutschland gi[bt] es derz[eit] 15 anerkannte Biosphärenreser[vate]."},
{id:34, short:"Secondhand", title:"Secondhand – nachhaltig einkaufen", raw:"Ob bei kommerz[iellen] Anbietern, i[n] privat organis[ierten] Gruppen inner[halb] der sozi[alen] Medien od[er] ganz einf[ach] in Fo[rm] eines Flohmar[kts|ktes]: Der Han[del] mit gebrau[chten] Gegenständen, Kleidungsstü[cken] und Ähnli[chem] boomt. Ne[ben] der Cha[nce] hier u[nd] da b[ei] den angebo[tenen] Waren e[in] echtes Schnäp[pchen] zu ergat[tern], treibt vi[ele] Interessierte d[er] Gedanke a[n], Waren, d[ie] bei ih[ren] Nutzern d[as] Ende ih[rer] Brauchbarkeit erre[icht] haben, sozus[agen] eine ne[ue] Chance z[u] geben u[nd] sie z[um] selben Zw[eck] bei si[ch] selbst einzus[etzen] oder z[u] einem and[eren] Nutzungszweck entspr[echend] umzugestalten. Di[ese] Tatsache ma[cht] den Erw[erb] gebrauchter Prod[ukte] auch z[u] einer se[hr] nachhaltigen Fo[rm] des Umg[angs] mit ber[eits] verfügbar gemac[hten] Rohstoffen."},
{id:35, short:"Nibelungenlied", title:"Das Nibelungenlied", raw:"Das Nibelungenlied ist e[in] in Mittelhochdeut[sch] anonym verfa[sstes] Heldenepos d[es] Mittelalters, d[as] ursprünglich vermu[tlich] in mündl[icher] Form sei[ne] Überlieferung fa[nd]. Indizien i[n] der Hand[lung] des Ep[os] weisen dar[auf] hin, da[ss] es al[ler] Wahrscheinlichkeit na[ch] zu Beg[inn] des dreize[hnten] Jahrhunderts verf[asst] wurde. D[ie] Handlung d[es] Epos i[st] am Rhe[in] rund u[m] Worms so[wie] in Süddeutschla[nd] angesiedelt u[nd] rankt si[ch] zum Großte[il] um d[as] Leben d[es] Siegfried, ei[nes] Prinzen, des[sen] Werben u[m] und se[ine] Ehe m[it] Kriemhild, se[ine] Ermordung, so[wie] Kriemhilds Rac[he] nach Siegf[rieds] Tod. Unglückli[cherweise] ist d[as] Nibelungenlied dur[ch] seine Umdeu[tung] zur natio[nalen] Heldensage i[m] Nationalsozialismus b[is] heute e[in] als schw[ierig] wahrgenommener T[eil] der deutschen Literaturgeschichte."},
{id:36, short:"Gesellschaftskritik", title:"Gesellschaftskritik", raw:"Wir leben in einer Zeit der Vereinzelung, i[n] der soz[iale] Kontakte zuneh[mend] nicht me[hr] in d[er] persönlichen Begeg[nung], sondern üb[er] das Intern[et] als Med[ium] stattfinden. D[em] technischen Fortschr[itt] wohnt ne[ben] großen Möglich[keiten] der Verne[tzung] daher au[ch] die Gef[ahr] inne, d[ie] Fähigkeit z[ur] Interaktion v[on] Angesicht z[u] Angesicht z[u] verlieren u[nd] im rea[len] Leben u[nd] im All[tag] an Gren[zen] zu sto[ßen], wenn e[s] darum ge[ht], mit sei[nen] Mitmenschen Kompr[omisse] zu schli[eßen] oder Konfl[ikte] zu lö[sen]. Wohin steu[ern] wir m[it] dieser Entwi[cklung]? Werden w[ir] durch d[ie] virtuelle Verne[tzung] nicht au[ch] steuerbar, we[il] wir un[ser] Leben onl[ine] leben u[nd] nur no[ch] selten Berührungspun[kte] mit d[em] Leben v[or] unserer Haust[ür] haben?"}

{id:"b1-111", book:"b1", num:111, short:"Konjunktiv II", title:"Konjunktiv II", raw:"D[er] Konjunktiv II i[st] eines d[er] vielseitigsten gramma[tischen] Konstrukte d[er] deutschen Spr[ache]. Keine and[ere] Kombination v[on] Worten lä[sst] sich s[o] unterschiedlich verwe[nden] wie d[er] Konjunktiv II. D[as] Konstrukt eig[net] sich, u[m] die Höflic[hkeit] einer Situa[tion] zu verdeu[tlichen] oder u[m] ihre Irrea[lität] zu unterst[reichen]. Auch Wün[sche] oder Bit[ten] werden du[rch] den Konju[nktiv] II ausgedrückt."},
{id:"b1-112", book:"b1", num:112, short:"Architektur", title:"Architektur", raw:"Die Konstru[ktionen] der zeitgenöss[ischen] Architektur si[nd] für vi[ele] Menschen d[ie] perfekte Verbi[ndung] moderner Philos[ophie] mit d[en] physikalischen Möglic[hkeiten] des 21. Jahrhund[erts]. Je grö[ßer] und ausgef[allener] ein Geb[äude] ist, de[sto] mehr wi[rd] es w[ie] ein Kunstwe[rk] von d[er] Öffentlichkeit disku[tiert]. Viele Mens[chen] denken ab[er] auch, da[ss] sehr gr[oße] Gebäude ni[cht] notwendig si[nd]."},
{id:"b1-113", book:"b1", num:113, short:"Wasser und der Körper", title:"Wasser und der Körper", raw:"Neu[este|e] wissenschaftliche Erkenn[tnisse] bestätigen, d[ass] es f[ür] den mensch[lichen] Körper überlebenswic[htig] ist, täg[lich] genügend Flüssi[gkeit] zu erha[lten]. Werden d[em] Körper ni[cht] mindestens zw[ei] Liter Was[ser] pro T[ag] zugeführt, s[o] ist z[um] Beispiel d[as] Gehirn, un[ser] wichtigstes Or[gan], nicht me[hr] zu optim[alen] Leistungen fä[hig]. Es vertro[cknet] im wahr[sten] Sinne d[es] Wortes."},
{id:"b1-114", book:"b1", num:114, short:"Verkehrskollaps", title:"Verkehrskollaps", raw:"Der Verk[ehr] auf Deutschla[nds] Straßen wi[rd] immer dic[hter], die St[aus] länger u[nd] nicht zul[etzt] leidet d[ie] Luft, d[ie] wir täg[lich] atmen, un[ter] dem Ausst[oß] von Kohlendio[xid], Schwefel u[nd] anderen Gif[ten]. In Deutschla[nd] wird se[it] etwa fünfz[ehn] Jahren ak[tiv] die Luftversch[mutzung] bekämpft. And[ere] Länder d[er] Erde boykot[tieren] jedoch o[ft] die Umweltschutzbemüh[ungen]."},
{id:"b1-115", book:"b1", num:115, short:"Rente", title:"Rente", raw:"Wenn Mens[chen] während ih[res] Erwerbslebens rentenversicherungspflic[htig] beschäftigt wa[ren], erhalten s[ie] nach Abla[uf] der Regelarbeitsze[it], die mome[ntan] noch b[ei] 67 Jahren li[egt], eine Re[nte] vom St[aat]. Die Re[nte], die al[te] Menschen erha[lten], wird ü[ber] die Beit[räge] der Mens[chen] finanziert, d[ie] momentan erwerb[stätig] sind. Di[ese] Methode ne[nnt] man i[n] Deutschland au[ch] den „Generationenver[trag]“."},
{id:"b1-116", book:"b1", num:116, short:"Wasserkonsum", title:"Wasserkonsum", raw:"In Deutschla[nd] wird, w[ie] in je[dem] anderen La[nd] der We[lt] auch, se[hr] viel Was[ser] getrunken. D[ie] Deutschen lie[ben] ihr Was[ser] jedoch meis[tens] mit Kohlensä[ure] versetzt. Die[ses] Wasser w[ird] dann „Spru[del]“ oder „Mineralwa[sser] mit Kohlensä[ure]“ genannt. Be[im] Öffnen ei[ner] Flasche Spru[del] entweicht d[ie] überflüssige Kohlensä[ure], der Re[st] bleibt i[m] Wasser zu[rück]."},
{id:"b1-117", book:"b1", num:117, short:"Kohlendioxid", title:"Reduzierung von Kohlendioxid", raw:"Pol[itik] und Med[ien] fordern inzwi[schen] die Mens[chen] immer wie[der] auf, Ene[rgie] zu spa[ren], um d[ie] Menge v[on] Kohlendioxid i[n] der Atmos[phäre] der Er[de] zu verri[ngern]. Kohlendioxid i[st] einer d[er] Verursacher d[er] weltweiten Klimaveränd[erungen], mit de[ren] Auswirkungen w[ir] jeden T[ag] leben müs[sen]. Schon d[as] Ausschalten d[er] Stand-by-Taste a[m] Fernseher ka[nn] helfen."},

// Combine two saved states: best grade per text wins, newest draft wins, a reset wipes everything older.
function mergeStores(a, b){
  const out = blank();
  out.resetAt = Math.max(a.resetAt || 0, b.resetAt || 0);
  out.mode = b.mode || a.mode || 'uebung';
  out.book = b.book || a.book || 'b2';
  [a, b].forEach(src => {
    Object.entries(src.best || {}).forEach(([id, v]) => {
      if (!v || (v.date || 0) < out.resetAt) return;
      const cur = out.best[id];
      if (!cur || v.pct > cur.pct || (v.pct === cur.pct && (v.date || 0) < (cur.date || 0))) out.best[id] = v;
    });
    Object.entries(src.drafts || {}).forEach(([id, v]) => {
      if (!v || (v.savedAt || 0) < out.resetAt) return;
      const cur = out.drafts[id];
      if (!cur || (v.savedAt || 0) > (cur.savedAt || 0)) out.drafts[id] = v;
    });
  });
  Object.keys(out.drafts).forEach(id => { const b = out.best[id], d = out.drafts[id]; if (b && (b.date || 0) > (d.savedAt || 0)) delete out.drafts[id]; });
  // Mistakes and attempts are a log: union of both sides, never cleared by a reset.
  const union = (x, y, key) => { const m = new Map(); (x || []).concat(y || []).forEach(e => { if (e) m.set(key(e), e); }); return [...m.values()].sort((p, q) => p.at - q.at).slice(-MAX_LOG); };
  out.mistakes = union(a.mistakes, b.mistakes, e => e.at + '|' + e.t + '|' + e.i);
  out.attempts = union(a.attempts, b.attempts, e => e.at + '|' + e.t);
  return out;
}
function saveStore(){
  try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){}
  if (cloud.ok) { clearTimeout(cloudT); cloudT = setTimeout(pushCloud, 800); }
}
function pushCloud(){
  if (!cloud.ok) return;
  cloud.doc.set({v:1, data: JSON.stringify(store), savedAt: Date.now()}).then(() => setCloudState('cloud')).catch(err => {
    const code = err && err.code;
    if (code === 'unavailable') setTimeout(pushCloud, 1500 + Math.random() * 1500);
    else { cloud.ok = false; setCloudState('local'); }
  });
}
function setCloudState(st){ cloud.state = st; const el = $('#saveState'); if (el) renderSaveState(); }
function renderSaveState(){
  const el = $('#saveState');
  el.textContent = cloud.state === 'cloud' ? 'Fortschritt wird in deinem Claude-Konto gespeichert und ist auf jedem Gerät da.'
    : cloud.state === 'pending' ? 'Speicherort wird geprüft …'
    : cloud.state === 'device' ? 'Fortschritt wird auf diesem Gerät gespeichert. Tipp: Seite zum Home-Bildschirm hinzufügen, dann bleibt er sicher erhalten.'
    : 'Fortschritt wird nur in diesem Browser gespeichert. Sichere ihn mit einem Sicherungscode.';
  el.dataset.state = cloud.state;
}
async function initCloud(){
  try {
    if (!window.claude || typeof window.claude.use !== 'function') { setCloudState('device'); askPersist(); return; }
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    const uid = user ? await user.id() : null;
    if (!db || !uid) throw 0;
    const doc = db.doc('data/users/' + uid + '/progress');
    const snap = await doc.get();
    let remote = null;
    if (snap.exists) { try { remote = JSON.parse(snap.data().data); } catch(e){} }
    const merged = remote ? mergeStores(store, remote) : store;
    const changed = JSON.stringify(merged) !== JSON.stringify(remote);
    store = merged;
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){}
    cloud = {doc, ok:true, state:'cloud'};
    if (!$('#home').hidden) renderHome(); else renderSaveState();
    if (changed && (Object.keys(store.best).length || Object.keys(store.drafts).length || store.resetAt || store.mistakes.length)) pushCloud();
  } catch(e) { cloud.ok = false; setCloudState('local'); askPersist(); }
}
// Ask the browser not to clear this site's storage (honoured mainly on Android/Chrome).
function askPersist(){ try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch(e){} }

// Backup code: the whole progress as one copyable text, for viewers without account storage.
function backupCode(){
  const json = JSON.stringify({best: store.best, drafts: store.drafts, resetAt: store.resetAt, mistakes: store.mistakes, attempts: store.attempts});
  return 'LH1-' + btoa(unescape(encodeURIComponent(json)));
}
function readBackup(code){
  code = String(code || '').trim().replace(/\s+/g, '');
  if (!code.startsWith('LH1-')) throw new Error('bad');
  const o = JSON.parse(decodeURIComponent(escape(atob(code.slice(4)))));
  if (!o || typeof o.best !== 'object') throw new Error('bad');
  return o;
}

const norm = s => s.trim().replace(/\s+/g,'').toLocaleLowerCase('de').replace(/ß/g,'ss');
function isCorrect(g, v){
  const n = norm(v); if (!n) return false;
  return g.ans.some(a => n === norm(a) || n === norm(g.pre + a));
}
// Studienkollegs give no school grades: 1 point per fully correct gap, pass from 60 %,
// popular Studienkollegs rank applicants and usually need about 75–85 % for a place.
function grade(p){
  if (p >= 85) return {lvl:3, c:'Hervorragend!', w:'Das reicht auch für begehrte Studienkollegs.'};
  if (p >= 75) return {lvl:2, c:'Stark!', w:'Konkurrenzfähig: gute Chancen auf einen Platz.'};
  if (p >= 60) return {lvl:1, c:'Bestanden!', w:'Über der 60-%-Grenze. Für begehrte Plätze noch etwas zulegen.'};
  return {lvl:0, c:'Noch nicht bestanden', w:'Unter der 60-%-Grenze. Weiter üben, das wird!'};
}
const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const fmtPts = p => String(p).replace('.', ',');
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch(e){} };

let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }

function modal(text, okLabel, onOk, cancelLabel='Zurück'){
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  scrim.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><p>${esc(text)}</p><div class="row"><button class="btn" data-a="no">${esc(cancelLabel)}</button><button class="btn primary" data-a="ok">${esc(okLabel)}</button></div></div>`;
  const close = () => scrim.remove();
  scrim.addEventListener('click', e => {
    const a = e.target.closest('[data-a]');
    if (e.target === scrim || (a && a.dataset.a === 'no')) close();
    else if (a && a.dataset.a === 'ok') { close(); onOk(); }
  });
  document.body.appendChild(scrim);
  scrim.querySelector('[data-a="ok"]').focus();
}

function show(id){
  ['home','play','result'].forEach(s => { $('#'+s).hidden = s !== id; });
  $('#dock').hidden = id !== 'play';
  window.scrollTo(0,0);
}

  const book = BOOKS[store.book] ? store.book : 'b2', list = currentList();

  $('#examInfo').textContent = BOOKS[book].examInfo;
  $('#list').innerHTML = list.map(t => {

    if (t.set) parts.push(`${n} Lücken, 25 Minuten. ${t.sub}`);
    if (b) parts.push(`Bestes Ergebnis: ${b.pct} %`);

    : 'Ab jetzt werden deine Fehler gespeichert. Später kannst du sie hier als Datei exportieren.';

$('#modeU').addEventListener('click', () => { store.mode = 'uebung'; saveStore(); renderHome(); });
$('#modeP').addEventListener('click', () => { store.mode = 'pruefung'; saveStore(); renderHome(); });
$('#list').addEventListener('click', e => { const b = e.target.closest('button[data-id]'); if (b) start(b.dataset.id); });
document.querySelectorAll('.book').forEach(btn => btn.addEventListener('click', () => { store.book = btn.dataset.book; saveStore(); renderHome(); }));
$('#resetAll').addEventListener('click', () => modal('Alle Noten und angefangenen Übungen löschen? Die gespeicherten Fehler bleiben erhalten.', 'Löschen', () => { store.best = {}; store.drafts = {}; store.resetAt = Date.now(); saveStore(); renderHome(); toast('Alles zurückgesetzt.'); }));

// Export: one self-contained file with every logged mistake in its sentence, ready for review.
function sentenceOf(t, gi){
  const parts = []; let k = 0, mark = -1;
  t.tokens.forEach(tok => {
    if (tok.type === 'txt') parts.push(tok.v);
    else if (tok.type === 'gap') { if (k === gi) { mark = parts.join('').length; parts.push('[[' + tok.pre + '___]]'); } else parts.push(tok.pre + tok.ans[0]); k++; }
  });
  const text = parts.join('');
  const ends = /[.!?](?=\s+(?:[„A-ZÄÖÜ]|\[\[[„A-ZÄÖÜ]))/g; let start = 0, end = text.length, mm;
  while ((mm = ends.exec(text))) { const pos = mm.index + 1; const tail = text.slice(Math.max(0, pos - 4), pos); if (/(^|\s)[a-zäöüA-ZÄÖÜ]{1,2}\.$/.test(tail) || /\d\.$/.test(tail)) continue; if (pos <= mark) start = pos; else { end = pos; break; } }
  return text.slice(start, end).trim();
}
function exportMistakes(){
  const items = store.mistakes.map(x => {
    const t = ALL[x.t], g = t && t.gaps[x.i]; if (!g) return null;
    const typed = x.typed ? (norm(x.typed).startsWith(norm(g.pre)) && g.pre ? x.typed : g.pre + x.typed) : '';
    return {date: new Date(x.at).toISOString().slice(0, 16).replace('T', ' '), book: BOOKS[t.book].name, text: t.num, title: t.title, gap: x.i + 1,
      result: x.s === 'w' ? 'falsch' : x.s === 'e' ? 'leer' : 'mit Buchstaben-Tipp', mode: x.m === 'p' ? 'Prüfung' : x.m === 'r' ? 'Verbesserung' : 'Übung',
      correct: g.pre + g.ans[0], accepted: g.ans.map(a => g.pre + a), typed, sentence: sentenceOf(t, x.i), grammar: g.hint ? g.hint[0] : '', meaning: g.hint ? g.hint[1] : '',
      hintsUsed: x.hl || 0};
  }).filter(Boolean);
  const attempts = store.attempts.map(a => { const t = ALL[a.t]; return t && {date: new Date(a.at).toISOString().slice(0, 16).replace('T', ' '), what: t.set ? t.title : `${BOOKS[t.book].name}, Text ${t.num}`, mode: a.m === 'p' ? 'Prüfung' : a.m === 'r' ? 'Verbesserung' : 'Übung', percent: a.pct, gaps: a.n, wrong: a.wrong, empty: a.empty}; }).filter(Boolean);
  const data = JSON.stringify({app: 'Lückenheft', kind: 'fehler-export', version: 1, exported: new Date().toISOString(), mistakes: items, attempts}, null, 1);
  const filename = 'lueckenheft-fehler-' + new Date().toISOString().slice(0, 10) + '.json';
  return {data, filename, count: items.length};
}
async function downloadMistakes(){
  const {data, filename} = exportMistakes();
  try {
    const dl = window.claude && typeof window.claude.use === 'function' ? await claude.use('downloads') : null;
    if (dl) { await dl.save({filename, data}); toast('Fehler-Datei gespeichert.'); return; }
  } catch(e){ if (e && e.code === 'declined') return; }
  try {
    const url = URL.createObjectURL(new Blob([data], {type: 'application/json'}));
    const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast('Datei „' + filename + '“ wird heruntergeladen.');
  } catch(e){
    codeModal('Download nicht möglich. Kopiere den Text und schicke ihn als Nachricht.', data, 'Kopieren', (ta, close) => { ta.select(); try { document.execCommand('copy'); close(); toast('Kopiert.'); } catch(err){} });
  }
}
$('#mistakesBtn').addEventListener('click', downloadMistakes);

/* ---------- Play ---------- */
let cur = null, lastInput = null, draftT;

function start(id, retry){
  const t = ALL[id]; if (!t) { renderHome(); show('home'); return; }
  const n = t.gaps.length;
  cur = { t, mode: t.set ? 'pruefung' : (t.book === 'b1' ? store.mode : store.mode), retry: !!retry,
    answers: Array(n).fill(''), hints: Array(n).fill(false), hl: Array(n).fill(0),
    locked: Array(n).fill(false), lockedStatus: Array(n).fill(null),
    start: Date.now(), before: 0, timer: null, done: false };
  if (retry) {
    retry.status.forEach((s, i) => { if (s === 'ok' || s === 'hint') { cur.locked[i] = true; cur.lockedStatus[i] = s; cur.answers[i] = retry.answers[i]; cur.hints[i] = s === 'hint'; } });
  } else if (cur.mode === 'uebung' && store.drafts[id]) {
    const d = store.drafts[id];
    d.answers.slice(0, n).forEach((v, i) => cur.answers[i] = v || '');
    (d.hints || []).slice(0, n).forEach((v, i) => cur.hints[i] = !!v);
    (d.hl || []).slice(0, n).forEach((v, i) => cur.hl[i] = +v || 0);
    cur.before = d.elapsed || 0;
  }
  renderPlay(); show('play'); startClock();
  if (!retry && cur.mode === 'uebung' && store.drafts[id]) toast('Weiter, wo du aufgehört hast.');
  if (retry) toast(`${cur.locked.filter(x => !x).length} Lücken zum Verbessern.`);
}
const isExam = () => cur.mode === 'pruefung' && !cur.retry;

function renderPlay(){
  const t = cur.t;
  $('#barTitle').textContent = t.set ? t.short : `(${t.num}) ${t.short}`;
  $('#playTitle').textContent = t.title;
  $('#playMeta').textContent = cur.retry ? 'Verbesserung: Die richtigen Lücken sind schon ausgefüllt.'
    : isExam() ? `Prüfung: ${Math.round(t.seconds / 60)} Minuten für ${t.gaps.length} Lücken. Bei 0:00 wird automatisch abgegeben.`
    : 'Übung: Ergänze den fehlenden Teil jedes Wortes. „Tipp“ zeigt erst die Grammatik, dann die Bedeutung, dann Buchstaben.';
  $('#tipBtn').hidden = isExam();
  const p = $('#passage'); p.textContent = ''; let gi = 0;
  t.tokens.forEach(tok => {
    if (tok.type === 'txt') { p.appendChild(document.createTextNode(tok.v)); return; }
    if (tok.type === 'head') { const h = document.createElement('span'); h.className = 'part'; h.textContent = tok.v; p.appendChild(h); return; }
    const i = gi++;
    const span = document.createElement('span'); span.className = 'gap';
    const pre = document.createElement('span'); pre.textContent = tok.pre;
    const inp = document.createElement('input');
    inp.type = 'text'; inp.dataset.i = i; inp.value = cur.answers[i];
    inp.setAttribute('autocomplete','off'); inp.setAttribute('autocorrect','off');
    inp.setAttribute('autocapitalize','none'); inp.setAttribute('spellcheck','false');
    inp.setAttribute('enterkeyhint', 'next');
    inp.setAttribute('aria-label', `Lücke ${i+1}: ${tok.pre} …`);
    if (cur.locked[i]) inp.disabled = true;
    span.append(pre, inp); p.appendChild(span); size(inp);
  });
  lastInput = null; updateCount(); hideHint();
}
function size(inp){ inp.style.width = Math.max(2.8, inp.value.length * 0.5 + 1.1) + 'em'; }
function updateCount(){
  const n = cur.answers.length, filled = cur.answers.filter(v => v.trim()).length;
  $('#progFill').style.width = (filled / n * 100) + '%';
  $('#submitBtn').textContent = `Abgeben ${filled}/${n}`;
}
function saveDraftSoon(){
  if (cur.mode !== 'uebung' || cur.retry || cur.done) return;
  clearTimeout(draftT); draftT = setTimeout(saveDraftNow, 300);
}
function saveDraftNow(){
  if (!cur || cur.mode !== 'uebung' || cur.retry || cur.done) return;
  if (cur.answers.some(v => v.trim())) store.drafts[cur.t.id] = { answers: cur.answers.slice(), hints: cur.hints.slice(), hl: cur.hl.slice(), elapsed: elapsed(), savedAt: Date.now() };
  saveStore();
}
document.addEventListener('visibilitychange', () => { if (document.hidden && cur && !$('#play').hidden) saveDraftNow(); });

const passage = $('#passage');
passage.addEventListener('input', e => {
  const inp = e.target; if (inp.tagName !== 'INPUT') return;
  cur.answers[+inp.dataset.i] = inp.value; size(inp); updateCount(); saveDraftSoon();
});
passage.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); focusNext(+e.target.dataset.i); }
});
passage.addEventListener('focusin', e => {
  if (e.target.tagName !== 'INPUT') return;
  lastInput = e.target;
  showHint(+e.target.dataset.i);
  setTimeout(() => { if (document.activeElement === e.target) ensureVisible(e.target); }, 320);
});
function focusNext(i){
  const next = [...passage.querySelectorAll('input:not(:disabled)')].find(x => +x.dataset.i > i);
  if (next) next.focus({preventScroll:true}), ensureVisible(next);
  else { document.activeElement.blur(); toast('Letzte Lücke erreicht. Bereit zum Abgeben?'); }
}
function ensureVisible(el){
  const r = el.getBoundingClientRect();
  const vv = window.visualViewport;
  const vh = vv ? vv.height : window.innerHeight;
  const dockTop = $('#dock').hidden ? vh : $('#dock').getBoundingClientRect().top;
  const top = 80, bottom = Math.min(vh, dockTop) - 12;
  if (r.top < top || r.bottom > bottom) window.scrollBy({top: r.top - Math.max(top, (bottom - top) * 0.45), behavior: reduceMotion ? 'auto' : 'smooth'});
}

// Dock keys keep the keyboard open: act on touchstart / mousedown and cancel the focus change.
function bindKey(btn, fn){
  btn.addEventListener('touchstart', e => { e.preventDefault(); press(btn); fn(); }, {passive:false});
  btn.addEventListener('mousedown', e => { e.preventDefault(); press(btn); fn(); });
  btn.addEventListener('click', e => { if (e.detail === 0) fn(); });
}
function press(btn){ btn.classList.add('pressed'); setTimeout(() => btn.classList.remove('pressed'), 140); }
function target(){
  const a = document.activeElement;
  if (a && a.tagName === 'INPUT' && passage.contains(a) && !a.disabled) return a;
  if (lastInput && document.body.contains(lastInput) && !lastInput.disabled) return lastInput;
  return null;
}
document.querySelectorAll('.key[data-ch]').forEach(btn => bindKey(btn, () => {
  const el = target(); if (!el) { toast('Tippe zuerst in eine Lücke.'); return; }
  const ch = btn.dataset.ch;
  let s = el.selectionStart, en = el.selectionEnd;
  if (s == null) s = en = el.value.length;
  el.value = el.value.slice(0, s) + ch + el.value.slice(en);
  if (document.activeElement !== el) el.focus({preventScroll:true});
  try { el.setSelectionRange(s + 1, s + 1); } catch(e){}
  el.dispatchEvent(new Event('input', {bubbles:true}));
}));
function hideHint(){ const c = $('#hintCard'); c.hidden = true; c.dataset.i = ''; }
function showHint(i){
  const c = $('#hintCard'), g = cur && cur.t.gaps[i], lvl = cur ? cur.hl[i] : 0;
  if (!g || !g.hint || !lvl || isExam()) { hideHint(); return; }
  const rows = [`<div class="hc-row"><b>Grammatik</b><span>${esc(g.hint[0])}</span></div>`];
  if (lvl >= 2) rows.push(`<div class="hc-row"><b>Bedeutung</b><span>${esc(g.hint[1])}</span></div>`);
  const next = lvl < 2 ? 'Nochmal „Tipp“: Bedeutung.' : cur.hints[i] ? 'Nochmal „Tipp“: nächster Buchstabe.' : 'Nochmal „Tipp“: ersten Buchstaben zeigen. Dann zählt die Lücke nur noch ½ Punkt.';
  c.innerHTML = rows.join('') + `<p class="hc-next">${next}</p><button class="hc-x" aria-label="Tipp schließen">×</button>`;
  c.dataset.i = i; c.hidden = false;
  const x = c.querySelector('.hc-x');
  x.addEventListener('mousedown', e => e.preventDefault());
  x.addEventListener('touchstart', e => { e.preventDefault(); hideHint(); }, {passive:false});
  x.addEventListener('click', hideHint);
}
bindKey($('#tipBtn'), () => {
  const el = target(); if (!el) { toast('Tippe zuerst in eine Lücke, dann auf Tipp.'); return; }
  const i = +el.dataset.i, g = cur.t.gaps[i], sol = g.ans[0];
  if (g.hint && cur.hl[i] < 2) {
    cur.hl[i]++; showHint(i); saveDraftSoon(); buzz(8);
    if (document.activeElement !== el) el.focus({preventScroll:true});
    setTimeout(() => ensureVisible(el), 30);
    return;
  }
  let v = norm(el.value); if (v.startsWith(norm(g.pre)) && norm(g.pre).length && v.length > sol.length) v = v.slice(g.pre.length);
  let k = 0; while (k < v.length && k < sol.length && v[k] === sol[k].toLocaleLowerCase('de')) k++;
  if (k >= sol.length) { toast('Diese Lücke stimmt schon.'); return; }
  el.value = sol.slice(0, k + 1);
  cur.hints[i] = true;
  if (document.activeElement !== el) el.focus({preventScroll:true});
  try { el.setSelectionRange(el.value.length, el.value.length); } catch(e){}
  el.dispatchEvent(new Event('input', {bubbles:true}));
  buzz(10); showHint(i);
  if (k + 1 >= sol.length) toast('Fertig. Mit Buchstaben-Tipp zählt die Lücke einen halben Punkt.');
});

// Keep the dock above the iOS on-screen keyboard.
function placeDock(){
  const vv = window.visualViewport; if (!vv) return;
  const off = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
  $('#dock').style.transform = off > 1 ? `translateY(${-off}px)` : '';
}
if (window.visualViewport) { visualViewport.addEventListener('resize', placeDock); visualViewport.addEventListener('scroll', placeDock); }

function elapsed(){ return cur.before + (Date.now() - cur.start) / 1000; }
function startClock(){ stopClock(); tick(); cur.timer = setInterval(tick, 250); }
function stopClock(){ if (cur && cur.timer) { clearInterval(cur.timer); cur.timer = null; } }
function tick(){
  const c = $('#clock');
  if (isExam()) {
    const rem = (cur.t.seconds || 300) - elapsed();
    c.textContent = fmt(Math.ceil(Math.max(0, rem)));
    c.classList.toggle('low', rem <= 60);
    if (rem <= 0 && !cur.done) { stopClock(); if (document.activeElement) document.activeElement.blur(); toast('Die Zeit ist abgelaufen.'); buzz([60,40,60]); finish(); }
  } else { c.classList.remove('low'); c.textContent = fmt(elapsed()); }
}

$('#submitBtn').addEventListener('click', () => {
  const empty = cur.answers.filter(v => !v.trim()).length;
  if (empty) modal(empty === 1 ? 'Eine Lücke ist noch leer. Trotzdem abgeben?' : `${empty} Lücken sind noch leer. Trotzdem abgeben?`, 'Abgeben', finish, 'Weiterschreiben');
  else finish();
});
$('#backBtn').addEventListener('click', () => {
  if (isExam() && cur.answers.some(v => v.trim())) {
    modal('Prüfung abbrechen? Deine Antworten gehen verloren.', 'Abbrechen', () => { stopClock(); cur.done = true; renderHome(); show('home'); }, 'Weiterschreiben');
  } else { saveDraftNow(); stopClock(); cur.done = true; renderHome(); show('home'); }
});

/* ---------- Result ---------- */
function finish(){
  if (cur.done) return;
  cur.done = true; stopClock(); clearTimeout(draftT);
  const t = cur.t, n = t.gaps.length;
  const status = t.gaps.map((g, i) => {
    if (cur.locked[i]) return cur.lockedStatus[i];
    const v = cur.answers[i];
    if (!v.trim()) return 'empty';
    if (isCorrect(g, v)) return cur.hints[i] ? 'hint' : 'ok';
    return 'wrong';
  });
  const points = status.reduce((a, s) => a + (s === 'ok' ? 1 : s === 'hint' ? 0.5 : 0), 0);
  const pct = Math.round(points / n * 100);
  let streak = 0, run = 0;
  status.forEach(s => { run = (s === 'ok' || s === 'hint') ? run + 1 : 0; streak = Math.max(streak, run); });
  const g = grade(pct), time = elapsed();
  const prev = store.best[t.id];
  let record = false;
  if (!cur.retry) {
    if (!prev || pct > prev.pct) { store.best[t.id] = {pct, date: Date.now()}; record = !!prev; }
    if (cur.mode === 'uebung') delete store.drafts[t.id];
  }
  // Log every wrong, empty or letter-hint gap with what she typed, so mistakes can be reviewed later.
  const at = Date.now(), m = cur.retry ? 'r' : isExam() ? 'p' : 'u';
  t.gaps.forEach((gp, i) => {
    const st = status[i]; if (cur.locked[i] || (st !== 'wrong' && st !== 'empty' && st !== 'hint')) return;
    store.mistakes.push({at, t: gp.tid, i: gp.gi, typed: (cur.answers[i] || '').trim(), s: st === 'hint' ? 'h' : st === 'empty' ? 'e' : 'w', m, hl: cur.hl[i] || 0});
  });
  store.attempts.push({at, t: t.id, m, pct, n, wrong: status.filter(x => x === 'wrong').length, empty: status.filter(x => x === 'empty').length});
  if (store.mistakes.length > MAX_LOG) store.mistakes = store.mistakes.slice(-MAX_LOG);
  if (store.attempts.length > MAX_LOG) store.attempts = store.attempts.slice(-MAX_LOG);
  saveStore();
  cur.result = {status, points, pct, g, time, streak, record, answers: cur.answers.slice()};
  renderResult(); show('result');
  if (g.lvl >= 2) { confetti(); buzz([20,40,20]); } else buzz(30);
}

function shownAnswer(g, v){
  v = v.trim();
  if (norm(v).startsWith(norm(g.pre)) && g.pre && norm(v).length > norm(g.ans[0]).length) return v.slice(g.pre.length);
  return v;
}
function renderResult(){
  const t = cur.t, R = cur.result, n = t.gaps.length;
  $('#resTitle').textContent = t.set ? t.short : `(${t.num}) ${t.short}`;
  const wrong = R.status.filter(s => s === 'wrong' || s === 'empty').length;
  const label = cur.retry ? 'Verbesserung' : isExam() ? 'Prüfung' : 'Übung';
  $('#report').innerHTML = `
    <div class="grade" aria-label="${R.pct} Prozent">
      <svg viewBox="0 0 120 120" aria-hidden="true"><path pathLength="1" d="M66 9 C 98 10, 115 38, 111 66 C 107 96, 80 113, 54 110 C 25 107, 7 84, 10 55 C 13 28, 37 9, 63 11 C 74 12, 83 16, 90 22"/></svg>
      <span class="n">${R.pct}<small>%</small></span>
    </div>
    <div><p class="comment">${esc(R.g.c)}</p><p class="word">${esc(R.g.w)} ${label}.</p></div>
    ${R.record ? '<p class="badge">Neuer Bestwert!</p>' : ''}
    <div class="facts">
      <div><b>${fmtPts(R.points)}/${n}</b>Punkte</div>
      <div><b>${R.pct} %</b>richtig</div>
      <div><b>${fmt(R.time)}</b>Zeit</div>
    </div>
    <div class="scale" aria-hidden="true">
      <div class="track"></div>
      <span class="tick" style="left:60%"><i>60</i></span><span class="tick" style="left:75%"><i>75</i></span><span class="tick" style="left:85%"><i>85</i></span>
      <span class="me" style="left:${Math.min(100, Math.max(0, R.pct))}%"></span>
    </div>
    <p class="scalenote">So werten Studienkollegs: 1 Punkt pro richtiger Lücke, keine Noten. Bestanden ab 60 %, begehrte Studienkollegs brauchen meist 75–85 %.</p>`;
  const out = []; let gi = 0;
  t.tokens.forEach(tok => {
    if (tok.type === 'txt') { out.push(esc(tok.v)); return; }
    if (tok.type === 'head') { out.push(`<span class="part">${esc(tok.v)}</span>`); return; }
    const i = gi++, s = R.status[i], sol = tok.ans[0], v = R.answers[i];
    if (s === 'ok' || s === 'hint') { const alt = tok.ans.find(a => norm(a) === norm(shownAnswer(tok, v || ''))) || sol; out.push(`<span class="r ${s}">${esc(tok.pre)}<span class="u">${esc(alt)}</span></span>`); }
    else if (s === 'wrong') out.push(`<span class="r wrong">${esc(tok.pre)}<span class="bad">${esc(shownAnswer(tok, v))}</span><span class="fix">${esc(sol)}</span></span>`);
    else out.push(`<span class="r empty">${esc(tok.pre)}<span class="fix">${esc(sol)}</span></span>`);
  });
  $('#resPassage').innerHTML = out.join('');
  const miss = t.gaps.map((g, i) => ({g, i, s: R.status[i]})).filter(x => x.s === 'wrong' || x.s === 'empty');
  $('#mistakes').innerHTML = miss.length ? `<h3>${miss.length === 1 ? 'Ein Wort zum Merken' : miss.length + ' Wörter zum Merken'}</h3><ul>${miss.map(x =>
    `<li><span class="right">${esc(x.g.pre + x.g.ans[0])}</span><span class="yours">${x.s === 'empty' ? 'leer gelassen' : 'du: <s>' + esc(x.g.pre + shownAnswer(x.g, R.answers[x.i])) + '</s>'}</span></li>`).join('')}</ul>` : `<h3>Alle ${n} Lücken richtig. Stark!</h3>`;
  const sib = t.set ? SETS : t.book === 'b1' ? BAND1 : TEXTS, next = sib[sib.indexOf(t) + 1];
  $('#actions').innerHTML =
    (wrong ? `<button class="btn red" data-act="retry">Fehler verbessern (${wrong})</button>` : '') +
    (next ? `<button class="btn primary" data-act="next">Weiter mit ${next.set ? next.short : 'Text ' + next.num}</button>` : '') +
    `<button class="btn" data-act="again">${t.set ? 'Prüfung' : 'Text'} neu beginnen</button>` +
    `<button class="btn" data-act="home">Zur Übersicht</button>`;
}
$('#actions').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = cur.t.id;
  if (a === 'retry') start(id, {status: cur.result.status, answers: cur.result.answers});
  else if (a === 'next') { const sib = cur.t.set ? SETS : cur.t.book === 'b1' ? BAND1 : TEXTS; const nx = sib[sib.indexOf(cur.t) + 1]; if (nx) start(nx.id); }
  else if (a === 'again') { delete store.drafts[id]; saveStore(); start(id); }
  else { renderHome(); show('home'); }
});
$('#backBtn2').addEventListener('click', () => { renderHome(); show('home'); });

/* ---------- Confetti ---------- */
function confetti(){
  if (reduceMotion) return;
  const c = $('#confetti'); c.hidden = false;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = window.innerWidth, H = window.innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = [cs.getPropertyValue('--ink'), cs.getPropertyValue('--red'), cs.getPropertyValue('--green'), '#F2B705'].map(x => x.trim());
  const P = Array.from({length: 140}, () => ({
    x: W / 2 + (Math.random() - .5) * 60, y: H * 0.28,
    vx: (Math.random() - .5) * 13, vy: -Math.random() * 12 - 4,
    w: 5 + Math.random() * 6, h: 8 + Math.random() * 8, r: Math.random() * 6, vr: (Math.random() - .5) * .35,
    c: cols[Math.floor(Math.random() * cols.length)]
  }));
  const t0 = performance.now();
  (function frame(now){
    const t = now - t0; ctx.clearRect(0, 0, W, H);
    P.forEach(p => { p.vy += .32; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.globalAlpha = Math.max(0, 1 - t / 2600);
      ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.r * 2))); ctx.restore(); });
    if (t < 2600) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, W, H); c.hidden = true; }
  })(t0);
}

renderHome();
initCloud();
})();
</script>
